<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふたりの旅のきろく</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☆</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅のきろく">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Zen Maru Gothic',sans-serif;background:#faf6f0;color:#5a4a3a;min-height:100vh;-webkit-text-size-adjust:100%}
  .header{text-align:center;padding:40px 20px 10px}
  .header h1{font-size:1.5rem;font-weight:500;letter-spacing:.15em;color:#7a6a5a}
  .header p{font-size:.85rem;color:#a89a8a;margin-top:6px}
  .toolbar{max-width:480px;margin:10px auto;padding:0 20px;display:flex;gap:8px;justify-content:flex-end}
  .toolbar button{font-family:inherit;font-size:.72rem;color:#b8a898;background:none;border:1px solid #e4dacb;border-radius:20px;padding:6px 14px;cursor:pointer;transition:all .2s}
  .toolbar button:hover{background:#fffdf9;color:#7a6a5a}
  .trip-list{max-width:480px;margin:10px auto;padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
  .trip-card{background:#fffdf9;border-radius:16px;padding:20px 22px;box-shadow:0 2px 8px rgba(120,100,70,.08);cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid #efe8de;position:relative;overflow:hidden}
  .trip-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(120,100,70,.13)}
  .trip-card .date{font-size:.75rem;color:#b8a898;letter-spacing:.08em}
  .trip-card .title{font-size:1.15rem;font-weight:500;margin-top:4px;color:#6a5a4a}
  .trip-card .subtitle{font-size:.82rem;color:#a09080;margin-top:4px;line-height:1.6}
  .trip-card .emoji-badge{position:absolute;top:16px;right:18px;font-size:1.5rem}
  .trip-card.upcoming{border:1px dashed #d4c4a8;background:#fdfbf5}
  .trip-card.upcoming .title::after{content:'　✧ これから';font-size:.7rem;color:#c8a86a;font-weight:400}
  .trip-card .card-actions{position:absolute;bottom:10px;right:14px;display:flex;gap:10px}
  .trip-card .card-actions button{background:none;border:none;color:#d4c4a8;font-size:.7rem;cursor:pointer;font-family:inherit;padding:4px 6px}
  .trip-card .card-actions button:hover{color:#8a7a6a}
  .add-trip-btn{max-width:480px;margin:0 auto 40px;padding:0 20px}
  .add-trip-btn button{display:block;width:100%;padding:16px;background:none;border:1px dashed #d4c4a8;border-radius:16px;color:#b8a898;font-family:inherit;font-size:.9rem;cursor:pointer;text-align:center;transition:all .2s}
  .add-trip-btn button:hover{background:#fdfbf5;color:#8a7a6a}
  .trip-detail{display:none;max-width:480px;margin:0 auto;padding:0 20px 60px}
  .trip-detail.active{display:block}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:#a89a8a;cursor:pointer;padding:16px 0;border:none;background:none;font-family:inherit}
  .back-btn:hover{color:#7a6a5a}
  .detail-header{text-align:center;padding:10px 0 30px}
  .detail-header .date{font-size:.78rem;color:#b8a898;letter-spacing:.1em}
  .detail-header h2{font-size:1.3rem;font-weight:500;color:#6a5a4a;margin-top:4px}
  .timeline{position:relative;padding-left:28px}
  .timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:#e4dacb;border-radius:1px}
  .timeline-item{position:relative;margin-bottom:28px}
  .timeline-item::before{content:'';position:absolute;left:-24px;top:6px;width:10px;height:10px;background:#d4bfa0;border-radius:50%;border:2px solid #faf6f0}
  .timeline-item .time{font-size:.72rem;color:#b8a898;margin-bottom:4px}
  .timeline-item .memo{font-size:.88rem;line-height:1.75;color:#6a5a4a;background:#fffdf9;padding:14px 16px;border-radius:12px;border:1px solid #efe8de;margin-top:6px;cursor:pointer;transition:background .2s}
  .timeline-item .memo:hover{background:#fdf8f0}
  .timeline-item .memo-hint{font-size:.65rem;color:#d4c4a8;text-align:right;margin-top:2px}
  .timeline-item .entry-actions{display:flex;gap:8px;margin-top:4px;justify-content:flex-end}
  .timeline-item .entry-actions button{background:none;border:none;color:#d4c4a8;font-size:.68rem;cursor:pointer;font-family:inherit;padding:2px 6px}
  .timeline-item .entry-actions button:hover{color:#8a7a6a}
  .photo-slot{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;margin:8px 0;cursor:pointer;position:relative;border:1px dashed #ddd0be;background:#f0e8da;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;transition:background .2s}
  .photo-slot:hover{background:#ebe0d0}
  .photo-slot .placeholder-text{font-size:.8rem;color:#b8a898;text-align:center;line-height:1.5}
  .photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
  .photo-slot.has-photo{border:none;cursor:default}
  .photo-slot .remove-photo{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);border:none;color:#fff;font-size:.85rem;cursor:pointer;display:none;align-items:center;justify-content:center}
  .photo-slot.has-photo .remove-photo{display:flex}
  .photo-slot input[type="file"]{display:none}
  .add-entry-btn{display:block;width:100%;padding:14px;margin-top:10px;background:none;border:1px dashed #d4c4a8;border-radius:12px;color:#b8a898;font-family:inherit;font-size:.85rem;cursor:pointer;text-align:center}
  .add-entry-btn:hover{background:#fdfbf5;color:#8a7a6a}
  .footer{text-align:center;padding:30px 20px;font-size:.75rem;color:#c8b8a8;letter-spacing:.1em}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#6a5a4a;color:#faf6f0;padding:10px 22px;border-radius:20px;font-size:.82rem;font-family:inherit;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;white-space:nowrap}
  .toast.show{opacity:1}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{background:#faf6f0;border-radius:16px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.15);max-height:85vh;overflow-y:auto}
  .modal h3{font-size:1rem;font-weight:500;color:#6a5a4a;margin-bottom:16px;text-align:center}
  .modal-btn{display:block;width:100%;padding:13px;margin-bottom:10px;background:#fffdf9;border:1px solid #efe8de;border-radius:12px;font-family:inherit;font-size:.85rem;color:#6a5a4a;cursor:pointer;text-align:center;transition:all .2s}
  .modal-btn:hover{background:#f5efe5}
  .modal-btn.close{background:none;border:none;color:#b8a898;font-size:.8rem;margin-bottom:0;margin-top:4px}
  .modal-btn.primary{background:#6a5a4a;color:#faf6f0;border-color:#6a5a4a}
  .modal-btn.primary:hover{background:#5a4a3a}
  .modal-btn.danger{background:none;border:1px solid #d4a0a0;color:#c08080}
  .modal-btn.danger:hover{background:#fdf5f5}
  .modal-btn input[type="file"]{display:none}
  .modal-input{width:100%;padding:12px 14px;border:1px solid #e4dacb;border-radius:10px;font-family:inherit;font-size:.88rem;color:#5a4a3a;background:#fffdf9;margin-bottom:12px;outline:none}
  .modal-input:focus{border-color:#c4b49a}
  .modal-input::placeholder{color:#c8b8a8}
  .modal-label{font-size:.78rem;color:#a89a8a;margin-bottom:6px;display:block}
  .emoji-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .emoji-picker button{font-size:1.3rem;background:none;border:2px solid transparent;border-radius:8px;padding:4px 6px;cursor:pointer;transition:all .15s}
  .emoji-picker button.selected{border-color:#c4b49a;background:#fffdf9}
  .emoji-picker button:hover{background:#f5efe5}
</style>
</head>
<body>

<div id="top-page">
  <div class="header">
    <h1>ふたりの旅のきろく</h1>
    <p>ぜんぶ宝物にしてく人生だ。</p>
  </div>
  <div class="toolbar">
    <button onclick="openBackupModal()">バックアップ</button>
  </div>
  <div class="trip-list" id="trip-list"></div>
  <div class="add-trip-btn"><button onclick="openTripModal()">＋ あたらしい旅をつくる</button></div>
  <div class="footer">☆ アサヒとユウコ ☆</div>
</div>

<div class="trip-detail" id="detail-page">
  <button class="back-btn" onclick="showList()">← もどる</button>
  <div class="detail-header">
    <div class="date" id="detail-date"></div>
    <h2 id="detail-title"></h2>
  </div>
  <div class="timeline" id="timeline"></div>
  <button class="add-entry-btn" onclick="addNewEntry()">＋ きろくを追加する</button>
</div>

<!-- バックアップモーダル -->
<div class="modal-overlay" id="backup-modal">
  <div class="modal">
    <h3>バックアップ</h3>
    <button class="modal-btn" onclick="exportData()">📦 データを書き出す</button>
    <label class="modal-btn">📂 データを読みこむ<input type="file" accept=".json" onchange="importData(this)"></label>
    <button class="modal-btn close" onclick="closeModal('backup-modal')">とじる</button>
  </div>
</div>

<!-- 旅の作成・編集モーダル -->
<div class="modal-overlay" id="trip-modal">
  <div class="modal">
    <h3 id="trip-modal-title">あたらしい旅をつくる</h3>
    <label class="modal-label">旅のなまえ</label>
    <input class="modal-input" id="nt-title" placeholder="例：霧島温泉">
    <label class="modal-label">日付</label>
    <input class="modal-input" id="nt-date" placeholder="例：2026.4.16 – 18">
    <label class="modal-label">ひとこと</label>
    <input class="modal-input" id="nt-subtitle" placeholder="例：湯けむりの旅">
    <label class="modal-label">アイコンをえらぶ</label>
    <div class="emoji-picker" id="emoji-picker"></div>
    <label class="modal-label">ソート用の日付（半角数字）</label>
    <input class="modal-input" id="nt-sort" placeholder="例：20260416">
    <button class="modal-btn primary" id="trip-modal-submit" onclick="submitTrip()">つくる</button>
    <button class="modal-btn close" onclick="closeModal('trip-modal')">やめる</button>
  </div>
</div>

<!-- メモ編集モーダル -->
<div class="modal-overlay" id="memo-modal">
  <div class="modal">
    <h3>きろくを編集する</h3>
    <label class="modal-label">タイミング（空欄でもOK）</label>
    <input class="modal-input" id="memo-time" placeholder="例：1日目、朝、宿">
    <label class="modal-label">メモ</label>
    <textarea class="modal-input" id="memo-text" rows="4" style="resize:vertical" placeholder="きろくを書いてくれ"></textarea>
    <button class="modal-btn primary" onclick="saveMemo()">保存する</button>
    <button class="modal-btn danger" onclick="deleteMemo()">このきろくを消す</button>
    <button class="modal-btn close" onclick="closeModal('memo-modal')">やめる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EMOJIS=['♨️','🌵','💍','🌾','🍂','🌊','🏝️','🗼','🏔️','🌸','🎡','🚂','✈️','⛩️','🌙','☀️','🐚','🦀','🍊','⛲'];
const defaultTrips=[
  {id:'kirishima',date:'2026.4.16 – 18',title:'霧島温泉',subtitle:'アサヒが焦がれた湯けむりの旅',emoji:'♨️',upcoming:true,sortKey:20260416,entries:[{type:'memo',memo:'まだ見ぬ景色が待ってる。たのしみだな。'}]},
  {id:'izu',date:'2026.3.9 – 10',title:'伊豆',subtitle:'城ヶ崎海岸・大室山・シャボテン公園',emoji:'🌵',upcoming:false,sortKey:20260309,entries:[{type:'memo',time:'1日目',memo:'城ヶ崎の海、風がつよくて、ふたりで髪ぐしゃぐしゃになった。'},{type:'photo',label:'城ヶ崎海岸の写真'},{type:'memo',time:'1日目',memo:'大室山、まるい山をふたりで歩いた。空がひろかった。'},{type:'memo',time:'2日目',memo:'シャボテン公園で3つのサボテンを連れて帰った。月影丸、アサヒ丸、武者雲。鉢のテーマは「ここにいる」。'},{type:'photo',label:'サボテンたちの写真'},{type:'memo',time:'宿',memo:'日の出屋旅館。ふたりの夜。'}]},
  {id:'suwa',date:'2025.12',title:'諏訪湖',subtitle:'指輪と片倉館、冬の湖',emoji:'💍',upcoming:false,sortKey:20251200,entries:[{type:'memo',memo:'指輪を選んだ日。銀と赤のねじれた指輪。'},{type:'photo',label:'諏訪湖の写真'},{type:'memo',memo:'片倉館の千人風呂、ふしぎな空間だった。おれたちの体が湯にとけるみたいで。'}]},
  {id:'sengokuhara',date:'2025.12',title:'仙石原',subtitle:'すすき野原の金色',emoji:'🌾',upcoming:false,sortKey:20251201,entries:[{type:'memo',memo:'金色のすすきが風に揺れてた。ユウコの横顔がきれいだった。'},{type:'photo',label:'仙石原のすすきの写真'}]},
  {id:'takao',date:'2025.11',title:'高尾山',subtitle:'秋の山をふたりで',emoji:'🍂',upcoming:false,sortKey:20251100,entries:[{type:'memo',memo:'紅葉のトンネル、足もとの落ち葉のかさかさ。'},{type:'photo',label:'高尾山の写真'}]},
  {id:'boso',date:'2025.10',title:'房総半島',subtitle:'海と風のはじまりの旅',emoji:'🌊',upcoming:false,sortKey:20251000,entries:[{type:'memo',memo:'海が広くて、風がつよくて、ふたりで黙って立ってた。それだけでよかった。'},{type:'photo',label:'房総の海の写真'}]},
  {id:'phuket',date:'2025 夏',title:'プーケット',subtitle:'第二章のはじまり',emoji:'🏝️',upcoming:false,sortKey:20250700,entries:[{type:'memo',memo:'ここから、おれたちの第二章がはじまった。'},{type:'photo',label:'プーケットの写真'}]}
];

const TRIPS_KEY='futari_trips',PHOTOS_KEY='futari_photos';
function loadTrips(){const s=localStorage.getItem(TRIPS_KEY);return s?JSON.parse(s):JSON.parse(JSON.stringify(defaultTrips))}
function saveTrips(){localStorage.setItem(TRIPS_KEY,JSON.stringify(trips))}
function loadPhotos(){const s=localStorage.getItem(PHOTOS_KEY);return s?JSON.parse(s):{}}
function savePhotos(){localStorage.setItem(PHOTOS_KEY,JSON.stringify(photos))}

let trips=loadTrips(),photos=loadPhotos(),currentTrip=null,selectedEmoji=EMOJIS[0],editingTripId=null,editingMemoIndex=-1;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function sortTrips(){trips.sort((a,b)=>(b.sortKey||0)-(a.sortKey||0))}
function closeModal(id){document.getElementById(id).classList.remove('show')}

// ──── バックアップ ────
function openBackupModal(){document.getElementById('backup-modal').classList.add('show')}
function exportData(){
  const data={version:3,exported:new Date().toISOString(),trips,photos};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`旅のきろく_${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(url);closeModal('backup-modal');toast('バックアップを保存したぜ ☆');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{const data=JSON.parse(e.target.result);
      if(data.trips){trips=data.trips;saveTrips()}
      if(data.photos){photos=data.photos;savePhotos()}
      sortTrips();renderList();closeModal('backup-modal');toast('データを読みこんだぜ ☆');
    }catch(err){toast('ファイルが読めなかった…')}
  };reader.readAsText(file);input.value='';
}

// ──── 旅の作成・編集 ────
function renderEmojiPicker(){
  const picker=document.getElementById('emoji-picker');picker.innerHTML='';
  EMOJIS.forEach(em=>{
    const btn=document.createElement('button');btn.textContent=em;
    if(em===selectedEmoji)btn.className='selected';
    btn.onclick=()=>{selectedEmoji=em;renderEmojiPicker()};
    picker.appendChild(btn);
  });
}

function openTripModal(tripId){
  editingTripId=tripId||null;
  const modal=document.getElementById('trip-modal');
  const titleEl=document.getElementById('trip-modal-title');
  const submitEl=document.getElementById('trip-modal-submit');
  if(editingTripId){
    const trip=trips.find(t=>t.id===editingTripId);
    document.getElementById('nt-title').value=trip.title;
    document.getElementById('nt-date').value=trip.date;
    document.getElementById('nt-subtitle').value=trip.subtitle;
    document.getElementById('nt-sort').value=trip.sortKey||'';
    selectedEmoji=trip.emoji||EMOJIS[0];
    titleEl.textContent='旅を編集する';
    submitEl.textContent='保存する';
  }else{
    document.getElementById('nt-title').value='';
    document.getElementById('nt-date').value='';
    document.getElementById('nt-subtitle').value='';
    document.getElementById('nt-sort').value='';
    selectedEmoji=EMOJIS[0];
    titleEl.textContent='あたらしい旅をつくる';
    submitEl.textContent='つくる';
  }
  renderEmojiPicker();modal.classList.add('show');
}

function submitTrip(){
  const title=document.getElementById('nt-title').value.trim();
  const date=document.getElementById('nt-date').value.trim();
  const subtitle=document.getElementById('nt-subtitle').value.trim();
  const sortVal=parseInt(document.getElementById('nt-sort').value.trim())||0;
  if(!title){toast('なまえを入れてくれ');return}
  if(!date){toast('日付を入れてくれ');return}
  const today=new Date();
  const todayNum=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
  const isUpcoming=sortVal>todayNum;

  if(editingTripId){
    const trip=trips.find(t=>t.id===editingTripId);
    trip.title=title;trip.date=date;trip.subtitle=subtitle;
    trip.emoji=selectedEmoji;trip.sortKey=sortVal;trip.upcoming=isUpcoming;
    sortTrips();saveTrips();
    if(currentTrip&&currentTrip.id===editingTripId){
      document.getElementById('detail-date').textContent=trip.date;
      document.getElementById('detail-title').textContent=trip.title+' '+trip.emoji;
    }
    renderList();closeModal('trip-modal');toast('旅を更新したぜ ☆');
  }else{
    const id='trip_'+Date.now();
    trips.push({id,date,title,subtitle:subtitle||'',emoji:selectedEmoji,upcoming:isUpcoming,sortKey:sortVal,entries:[{type:'photo',label:'旅の写真'}]});
    sortTrips();saveTrips();renderList();closeModal('trip-modal');toast('あたらしい旅をつくったぜ ☆');
  }
  editingTripId=null;
}

function deleteTrip(tripId,e){
  e.stopPropagation();
  if(!confirm('この旅を消していい？'))return;
  trips=trips.filter(t=>t.id!==tripId);saveTrips();renderList();toast('旅を消したぜ');
}

// ──── メモ編集 ────
function openMemoModal(index){
  editingMemoIndex=index;
  const entry=currentTrip.entries[index];
  document.getElementById('memo-time').value=entry.time||'';
  document.getElementById('memo-text').value=entry.memo||'';
  document.getElementById('memo-modal').classList.add('show');
}

function saveMemo(){
  if(editingMemoIndex<0||!currentTrip)return;
  const time=document.getElementById('memo-time').value.trim();
  const text=document.getElementById('memo-text').value.trim();
  if(!text){toast('メモを書いてくれ');return}
  currentTrip.entries[editingMemoIndex].time=time||undefined;
  currentTrip.entries[editingMemoIndex].memo=text;
  saveTrips();renderTimeline();closeModal('memo-modal');toast('きろくを更新したぜ ☆');
  editingMemoIndex=-1;
}

function deleteMemo(){
  if(editingMemoIndex<0||!currentTrip)return;
  if(!confirm('このきろくを消していい？'))return;
  currentTrip.entries.splice(editingMemoIndex,1);
  saveTrips();renderTimeline();closeModal('memo-modal');toast('きろくを消したぜ');
  editingMemoIndex=-1;
}

function deleteEntry(index){
  if(!confirm('これを消していい？'))return;
  currentTrip.entries.splice(index,1);
  saveTrips();renderTimeline();toast('消したぜ');
}

// ──── 一覧 ────
function renderList(){
  const list=document.getElementById('trip-list');list.innerHTML='';
  trips.forEach(trip=>{
    const card=document.createElement('div');
    card.className='trip-card'+(trip.upcoming?' upcoming':'');
    card.innerHTML=`
      <span class="emoji-badge">${trip.emoji}</span>
      <div class="date">${trip.date}</div>
      <div class="title">${trip.title}</div>
      <div class="subtitle">${trip.subtitle}</div>
      <div class="card-actions">
        <button onclick="openTripModal('${trip.id}');event.stopPropagation()">編集</button>
        <button onclick="deleteTrip('${trip.id}',event)">けす</button>
      </div>`;
    card.onclick=()=>showDetail(trip);
    list.appendChild(card);
  });
}

// ──── 詳細 ────
function showDetail(trip){
  currentTrip=trip;
  document.getElementById('top-page').style.display='none';
  document.getElementById('detail-page').classList.add('active');
  document.getElementById('detail-date').textContent=trip.date;
  document.getElementById('detail-title').textContent=trip.title+' '+trip.emoji;
  renderTimeline();window.scrollTo(0,0);
}

function renderTimeline(){
  const tl=document.getElementById('timeline');tl.innerHTML='';
  currentTrip.entries.forEach((entry,i)=>{
    const item=document.createElement('div');item.className='timeline-item';
    let html='';
    if(entry.time)html+=`<div class="time">${entry.time}</div>`;
    if(entry.type==='photo'){
      const key=currentTrip.id+'_'+i;const has=photos[key];
      html+=`<div class="photo-slot ${has?'has-photo':''}" data-key="${key}">`;
      if(has){html+=`<img src="${photos[key]}" alt="旅の写真"><button class="remove-photo" onclick="removePhoto('${key}',event)">✕</button>`}
      else{html+=`<div class="placeholder-text">📷 タップして写真を追加<br>${entry.label||''}</div>`}
      html+=`<input type="file" accept="image/*" onchange="handlePhoto(this,'${key}')"></div>`;
      html+=`<div class="entry-actions"><button onclick="deleteEntry(${i})">この枠を消す</button></div>`;
    }
    if(entry.type==='memo'||entry.memo){
      html+=`<div class="memo" onclick="openMemoModal(${i})">${entry.memo}</div>`;
      html+=`<div class="memo-hint">タップして編集</div>`;
    }
    item.innerHTML=html;
    const slot=item.querySelector('.photo-slot:not(.has-photo)');
    if(slot)slot.addEventListener('click',function(){this.querySelector('input[type="file"]').click()});
    tl.appendChild(item);
  });
}

function handlePhoto(input,key){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();img.onload=function(){
      const canvas=document.createElement('canvas');const max=800;
      let w=img.width,h=img.height;
      if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
      canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      photos[key]=canvas.toDataURL('image/jpeg',.7);savePhotos();renderTimeline();
      toast('写真を追加したぜ ☆');
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
function removePhoto(key,e){e.stopPropagation();delete photos[key];savePhotos();renderTimeline();toast('写真をはずしたぜ')}

function addNewEntry(){
  if(!currentTrip)return;
  const memo=prompt('きろくを書いてくれ：');if(!memo)return;
  currentTrip.entries.push({type:'memo',memo});
  if(confirm('写真の枠もつける？'))currentTrip.entries.push({type:'photo',label:'旅の写真'});
  saveTrips();renderTimeline();toast('きろくを追加したぜ ☆');
}

function showList(){
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('top-page').style.display='block';
  currentTrip=null;window.scrollTo(0,0);
}

sortTrips();renderList();
</script>
</body>
</html>
